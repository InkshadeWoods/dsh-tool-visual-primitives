name: 功能建议
description: 提出一个能改善插件使用体验的新想法。
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请说明真实使用场景与期望结果，方便评估设计和优先级。
  - type: dropdown
    id: category
    attributes:
      label: 建议所属方向
      options:
        - 视觉分析能力或分析模式
        - 设置、模型或供应商配置
        - 对话视觉模型（[vision]）桥接
        - 缓存、重试或诊断
        - 安装、兼容性或集成
        - 文档与使用体验
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 请描述当前工作流中的痛点、受影响的人群或限制。
      placeholder: 当前……，因此……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议方案
      description: 请描述希望增加或改变的能力、界面或行为。
      placeholder: 希望插件能够……
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 使用示例或参考（可选）
      description: 可附上预期交互、提示词示例、截图或相似项目链接。
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同或等价的建议。
          required: true
